<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="pellicule\LOGO FOND 32x32 px.png"/>
  <title>Inscription</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: white;
      color: black;
      padding: 20px;
    }
     a {
      color: inherit; /* ou tu peux mettre une couleur personnalisée, ex: black, #333, etc. */
      text-decoration: none;
    }
    .container {
      display: flex;
      width: 100%;
      max-width: 1100px;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      position: relative;
    }
    .form-section {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 28px;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    label {
      font-weight: 600;
      font-size: 14px;
    }
    input {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    input:focus {
      border-color: #5B3021;
      outline: none;
      box-shadow: 0 0 8px rgba(91, 48, 33, 0.3);
    }
    button {
      background: #5B3021;
      color: white;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover {
      background: #3e2016;
    }
    .divider {
      margin: 30px 0 20px;
      height: 1px;
      background-color: #eee;
      position: relative;
    }
    .divider span {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      padding: 0 10px;
      font-size: 13px;
      color: #666;
    }
    .link-text {
      text-align: center;
      font-size: 14px;
    }
    .link-text a {
      color: #3b4eff;
      font-weight: 600;
      text-decoration: none;
    }
    .image-section {
      flex: 1;
      background-image: url('https://raw.githubusercontent.com/khadia04/pellicule-NI/main/chris-lee-70l1tDAI6rM-unsplash%201.png');
      background-size: cover;
      background-position: center;
    }

    /* Bouton retour accueil */
    .back-home {
      position: absolute;
      top: 20px;
      left: 20px;
      background-color: transparent;
      border: 2px solid #5B3021;
      color: #5B3021;
      padding: 8px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s;
    }
    .back-home:hover {
      background-color: #5B3021;
      color: white;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      .image-section {
        height: 200px;
      }
      .form-section {
        padding: 20px;
      }
      h1 {
        font-size: 22px;
      }
      .back-home {
        top: 10px;
        left: 10px;
        font-size: 12px;
        padding: 6px 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-home">← Accueil</a>  
    <div class="form-section">
      <h1>Inscription</h1>
      <form id="registerForm">
  <label for="firstName">Prénom</label>
  <input type="text" id="firstName" placeholder="Entrez votre prénom" required>

  <label for="lastName">Nom</label>
  <input type="text" id="lastName" placeholder="Entrez votre nom de famille" required>

  <label for="email">Adresse mail</label>
  <input type="email" id="email" placeholder="Entrez votre email" required>

  <label for="password">Mot de passe</label>
  <input type="password" id="password" placeholder="Mot de passe" required>

  <button type="submit">Inscrivez-vous</button>
  <div id="errorMessage" class="alert alert-danger d-none" role="alert">
    L'utilisateur existe déjà.
  </div>
</form>


      <div class="divider"><span>ou</span></div>
      <p class="link-text">Tu as déjà un compte ? <a href="index.html">Connecte-toi</a></p>
    </div>
    <div class="image-section"></div>
  </div>
    <script>
  function showError(message = "Une erreur est survenue.") {
    const errorDiv = document.getElementById('errorMessage');
    errorDiv.classList.remove('d-none');
    errorDiv.textContent = message;
  }

  document.getElementById("registerForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const firstName = document.getElementById("firstName").value.trim();
    const lastName = document.getElementById("lastName").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!firstName || !lastName || !email || !password) {
      showError("Veuillez remplir tous les champs");
      return;
    }

    let users = JSON.parse(localStorage.getItem("users")) || {};

    if (users[email]) {
      showError("Cet utilisateur existe déjà !");
      return;
    }

    const newUser = {
      firstName,
      lastName,
      email,
      password
    };

    users[email] = newUser;
    localStorage.setItem("users", JSON.stringify(users));
    localStorage.setItem("loggedInUser", JSON.stringify(newUser)); // pour affichage bonjour

    alert("Inscription réussie !");
    window.location.href = "index.html"; // redirection vers la connexion
  });
</script>

</body>
</html>
